<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ultra Premium - Login & Signup</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        /* Global Styles */
        * { box-sizing: border-box; font-family: 'Poppins', sans-serif; }
        body {
            /* Dark Theme Background for Premium feel */
            background: #0f172a;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
        }

        h1 {
            font-weight: 700;
            margin: 0;
            font-size: 2.2rem;
        }

        p {
            font-size: 14px;
            font-weight: 300;
            line-height: 20px;
            letter-spacing: 0.5px;
            margin: 20px 0 30px;
        }

        span {
            font-size: 12px;
        }

        a {
            color: #333;
            font-size: 14px;
            text-decoration: none;
            margin: 15px 0;
        }

        button {
            border-radius: 50px; /* Rounded buttons are more premium */
            border: none;
            background-color: #2563eb; /* A nice vibrant blue */
            color: #ffffff;
            font-size: 13px;
            font-weight: 600;
            padding: 15px 50px;
            letter-spacing: 1px;
            text-transform: uppercase;
            transition: transform 80ms ease-in, background-color 0.3s, box-shadow 0.3s;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(37, 99, 235, 0.3);
        }

        button:hover { background-color: #1d4ed8; box-shadow: 0 6px 20px rgba(37, 99, 235, 0.4); }
        button:active { transform: scale(0.95); }
        button:focus { outline: none; }

        button.ghost {
            background-color: transparent;
            border: 2px solid #ffffff;
            box-shadow: none;
        }
        button.ghost:hover { background-color: rgba(255,255,255,0.1); }

        form {
            background-color: #ffffff;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            padding: 0 50px;
            height: 100%;
            text-align: center;
        }

        input {
            background-color: #f3f4f6;
            border: none;
            padding: 15px;
            margin: 8px 0;
            width: 100%;
            border-radius: 8px;
            outline: none;
            transition: box-shadow 0.3s;
        }
        input:focus { box-shadow: 0 0 0 2px rgba(37, 99, 235, 0.5); }

        .container {
            background-color: #fff;
            border-radius: 20px; /* Higher border radius */
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5); /* Deeper shadow */
            position: relative;
            overflow: hidden;
            width: 900px;
            max-width: 100%;
            min-height: 600px; /* Slightly taller */
        }

        .form-container {
            position: absolute;
            top: 0;
            height: 100%;
            transition: all 0.6s ease-in-out;
        }

        .sign-in-container {
            left: 0;
            width: 50%;
            z-index: 2;
        }

        .container.right-panel-active .sign-in-container {
            transform: translateX(100%);
        }

        .sign-up-container {
            left: 0;
            width: 50%;
            opacity: 0;
            z-index: 1;
        }

        .container.right-panel-active .sign-up-container {
            transform: translateX(100%);
            opacity: 1;
            z-index: 5;
            animation: show 0.6s;
        }

        @keyframes show {
            0%, 49.99% { opacity: 0; z-index: 1; }
            50%, 100% { opacity: 1; z-index: 5; }
        }

        /* --- THE OVERLAY & ANIMATED BLOB SECTION --- */
        .overlay-container {
            position: absolute;
            top: 0;
            left: 50%;
            width: 50%;
            height: 100%;
            overflow: hidden;
            transition: transform 0.6s ease-in-out;
            z-index: 100;
            /* Giving the container rounded corners to match the main box when it's on edges */
            border-top-right-radius: 20px;
            border-bottom-right-radius: 20px;
        }

        .container.right-panel-active .overlay-container {
            transform: translateX(-100%);
            border-radius: 20px 0 0 20px;
        }

        .overlay {
            /* Solid dark background base */
            background: #1e1e2e; 
            color: #ffffff;
            position: relative;
            left: -100%;
            height: 100%;
            width: 200%;
            transform: translateX(0);
            transition: transform 0.6s ease-in-out;
            overflow: hidden; /* Important to contain the blob */
        }

        /* THE "TEDHAMEDHA" SHAPE (The Organic Blob) 
           This pseudo-element sits behind the text and animates its shape.
        */
        .overlay::before {
            content: '';
            position: absolute;
            width: 150%; /* Larger than container to allow movement */
            height: 150%;
            top: -25%;
            left: -25%;
            /* The Ultra Premium Gradient */
            background: linear-gradient(45deg, #ff00cc, #333399, #00d4ff);
            background-size: 200% 200%;
            /* Key animation for shape morphing */
            animation: 
                gradientMove 10s ease infinite,
                morphShape 15s ease-in-out infinite alternate;
            
            /* Initial "blob" shape using border-radius */
            border-radius: 60% 40% 30% 70% / 60% 30% 70% 40%;
            opacity: 0.8; /* Slight transparency for a deeper look */
            z-index: -1; /* Behind text */
        }

        /* Gradient Animation */
        @keyframes gradientMove {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* Shape Morphing Animation (Tedhamedha effect) */
        @keyframes morphShape {
            0% { border-radius: 60% 40% 30% 70% / 60% 30% 70% 40%; transform: rotate(0deg); }
            50% { border-radius: 30% 60% 70% 40% / 50% 60% 30% 60%; }
            100% { border-radius: 70% 30% 50% 60% / 40% 70% 60% 50%; transform: rotate(15deg); }
        }

        .container.right-panel-active .overlay {
            transform: translateX(50%);
        }

        .overlay-panel {
            position: absolute;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            padding: 0 40px;
            text-align: center;
            top: 0;
            height: 100%;
            width: 50%;
            transform: translateX(0);
            transition: transform 0.6s ease-in-out;
            z-index: 10; /* Text must be on top of the blob */
        }

        .overlay-left {
            transform: translateX(-20%);
        }

        .container.right-panel-active .overlay-left {
            transform: translateX(0);
        }

        .overlay-right {
            right: 0;
            transform: translateX(0);
        }

        .container.right-panel-active .overlay-right {
            transform: translateX(20%);
        }

        .social-container {
            margin: 20px 0;
        }
        .social-container a {
            border: 1px solid #dddddd;
            border-radius: 50%;
            display: inline-flex;
            justify-content: center;
            align-items: center;
            margin: 0 5px;
            height: 40px;
            width: 40px;
            transition: 0.3s;
        }
        .social-container a:hover {
            border-color: #2563eb;
            color: #2563eb;
            background: #f0f7ff;
        }
    </style>
</head>
<body>

<div class="container" id="container">
    <div class="form-container sign-up-container">
        <form action="#">
            <h1>Create Account</h1>
            <div class="social-container">
                <a href="#" class="social"><i class="fab fa-facebook-f">F</i></a>
                <a href="#" class="social"><i class="fab fa-google-plus-g">G</i></a>
                <a href="#" class="social"><i class="fab fa-linkedin-in">in</i></a>
            </div>
            <span>or use your email for registration</span>
            <input type="text" placeholder="Name" />
            <input type="email" placeholder="Email" />
            <input type="password" placeholder="Password" />
            <button>Sign Up</button>
        </form>
    </div>

    <div class="form-container sign-in-container">
        <form action="#">
            <h1>Sign in</h1>
            <div class="social-container">
                <a href="#" class="social"><i class="fab fa-facebook-f">F</i></a>
                <a href="#" class="social"><i class="fab fa-google-plus-g">G</i></a>
                <a href="#" class="social"><i class="fab fa-linkedin-in">in</i></a>
            </div>
            <span>or use your account</span>
            <input type="email" placeholder="Email" />
            <input type="password" placeholder="Password" />
            <a href="#">Forgot your password?</a>
            <button>Sign In</button>
        </form>
    </div>

    <div class="overlay-container">
        <div class="overlay">
            <div class="overlay-panel overlay-left">
                <h1>Welcome Back!</h1>
                <p>To keep connected with us please login with your personal info</p>
                <button class="ghost" id="signIn">Sign In</button>
            </div>
            <div class="overlay-panel overlay-right">
                <h1>Hello, Friend!</h1>
                <p>Enter your personal details and start journey with us</p>
                <button class="ghost" id="signUp">Sign Up</button>
            </div>
        </div>
    </div>
</div>

<script>
    const signUpButton = document.getElementById('signUp');
    const signInButton = document.getElementById('signIn');
    const container = document.getElementById('container');

    signUpButton.addEventListener('click', () => {
        container.classList.add("right-panel-active");
    });

    signInButton.addEventListener('click', () => {
        container.classList.remove("right-panel-active");
    });
</script>

</body>
</html>
